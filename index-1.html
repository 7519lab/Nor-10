<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nor10">

<body>
<title>Nor10 Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-column app, sticky top bar with mode tabs, content card stage below; phone first. */
:root{
  --bg:#f3f6f7; --panel:#ffffff; --fg:#17262b; --muted:#5c6f76; --line:#d5dee2;
  --accent:#1f6f8b; --accent-ink:#ffffff; --warm:#c8553d; --ok:#2f8f5b; --ok-bg:#e3f3ea; --warn-bg:#fbe9e4;
  --soft:#e6eef1; --shadow:0 2px 10px rgba(23,38,43,.08);
  --display:"Rubik","Noto Sans TC",system-ui,sans-serif; --body:"Noto Sans TC","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b20; --panel:#172730; --fg:#e8eef0; --muted:#9db0b8; --line:#2b3f48;
  --accent:#5fb3cf; --accent-ink:#0b1a20; --warm:#f08a72; --ok:#6fcf97; --ok-bg:#1d3a2b; --warn-bg:#46261f;
  --soft:#1f333c; --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b20; --panel:#172730; --fg:#e8eef0; --muted:#9db0b8; --line:#2b3f48;
  --accent:#5fb3cf; --accent-ink:#0b1a20; --warm:#f08a72; --ok:#6fcf97; --ok-bg:#1d3a2b; --warn-bg:#46261f;
  --soft:#1f333c; --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-size:1.35rem;margin:0;letter-spacing:.01em}
.brand h1 small{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:8px}
.streak{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:.9rem}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{padding-top:18px}
h2{font-family:var(--display);font-size:1.15rem;margin:0 0 10px;text-wrap:balance}
p.lead{color:var(--muted);margin:0 0 16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.deck{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;color:var(--fg);display:flex;flex-direction:column;gap:6px;min-width:0}
.deck:hover{border-color:var(--accent)}
.deck .n{font-family:var(--display);font-size:.75rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.deck .t{font-weight:700}
.deck .d{font-size:.85rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.meta{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;min-width:0}
.stage .type{display:inline-block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--muted);font-family:var(--display)}
.stage .type.concept{color:var(--accent)} .stage .type.comparison{color:var(--warm)} .stage .type.procedure{color:var(--ok)} .stage .type.application{color:#8a5bb3}
.stage h3{font-family:var(--display);font-size:1.3rem;margin:8px 0 6px;text-wrap:balance}
.stage .leadtxt{color:var(--fg);background:var(--soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 8px 8px 0;margin:0 0 14px;font-weight:500}
.pts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pts li{display:grid;grid-template-columns:minmax(72px,auto) 1fr;gap:10px;align-items:start;min-width:0}
.pts b{color:var(--accent);font-weight:600;font-size:.92rem}
.back{border-top:1px dashed var(--line);margin-top:16px;padding-top:14px;display:flex;flex-direction:column;gap:10px}
.back .q{background:var(--soft);border-radius:10px;padding:10px 12px}
.back .q small{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;font-family:var(--display)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.again{background:var(--warn-bg);color:var(--warm);border-color:transparent}
.btn.ghost{border-color:transparent;color:var(--muted)}
.spacer{flex:1}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.hint{font-size:.85rem;color:var(--muted)}
.vq{font-family:var(--display);font-size:1.6rem;margin:6px 0 2px}
.vq small{font-size:.95rem;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:8px}
input.answer{font:inherit;font-size:1.15rem;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);margin-top:10px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:500}
.fb.good{background:var(--ok-bg);color:var(--ok)} .fb.bad{background:var(--warn-bg);color:var(--warm)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:1.05rem}
.chip.placed{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.score div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.score b{display:block;font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.score span{font-size:.78rem;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.key{font-size:.78rem;color:var(--muted);margin-top:10px}
.say{all:unset;cursor:pointer;color:var(--accent);border-bottom:1px dotted var(--accent);padding:0 1px;border-radius:2px}
.say:hover,.say.playing{background:var(--soft)}
.say:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spk{border:1px solid var(--line);background:var(--panel);color:var(--accent);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;font-size:1rem;vertical-align:middle;margin-left:8px}
.spk:hover{border-color:var(--accent)}
.novoice{font-size:.8rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:10px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.stage{transition:transform .15s}}
@media (max-width:480px){.pts li{grid-template-columns:1fr}.stage{padding:16px}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand"><h1>Nor10 Studio <small>Byen er Bergen · Leksjon 1–10</small></h1><div class="streak" id="streak"></div></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="decks" aria-selected="true">複習卡</button>
    <button role="tab" data-tab="verbs" aria-selected="false">動詞拼寫</button>
    <button role="tab" data-tab="order" aria-selected="false">句子重組</button>
    <button role="tab" data-tab="stats" aria-selected="false">進度與發音</button>
  </nav>
</header>
<main id="main"></main>
</div>

<script>
const DATA = {"decks": [{"id": "01-verb-ordstilling", "short": "動詞與語序", "description": "動詞怎麼變、句子怎麼排", "cards": [{"id": "C1", "type": "concept", "title": "現在式怎麼變", "lead": "原形去掉 å，字尾加 r，就是現在式。", "points": [{"label": "原形", "body": "字典裡的樣子，前面有 å：å snakke（說）、å spise（吃）。"}, {"label": "現在式", "body": "把 å 拿掉、字尾加 r：snakker、spiser。不管主詞是誰都一樣，不用像英文加 s。"}, {"label": "要背的例外", "body": "gjøre→gjør（做）、si→sier（說）、spørre→spør（問）、vite→vet（知道）、være→er（是）。"}], "q1": "原形變現在式的規則是什麼？五個例外是哪些？", "q2": "看到 jeg vet，怎麼知道它的原形是 vite？為什麼不能用「去掉 r」倒推？"}, {"id": "C2", "type": "concept", "title": "現在式的三種用法", "lead": "挪威語沒有進行式，現在式一個打三個。", "points": [{"label": "現在正在做", "body": "Jeg er på forelesning.（我在上課。）Du spiser frokost nå.（你現在在吃早餐。）"}, {"label": "平常習慣", "body": "Hun drikker kaffe om morgenen.（她早上都喝咖啡。）"}, {"label": "未來的事", "body": "加上時間詞就能講未來：Han reiser til Oslo neste fredag.（他下週五去奧斯陸。）"}], "q1": "現在式可以表達哪三種時間？各舉一句。", "q2": "Jeg ringer deg（我打給你）這句，怎麼知道是「現在」還是「等一下」？靠什麼字判斷？"}, {"id": "C3", "type": "concept", "title": "V2：動詞永遠排第二", "lead": "一句話裡，動詞一定是第二個「位置」。", "points": [{"label": "規則", "body": "完整的句子裡，動詞固定在第 2 位。這是挪威語最重要的語序規則。"}, {"label": "「位置」不是「字」", "body": "I dag 是兩個字，但算一個位置。所以 I dag spiser jeg（今天我吃）動詞還是第 2 位。"}, {"label": "有兩個動詞時", "body": "只有第一個動詞要守第 2 位：Jeg pleier å drikke kaffe.（我習慣喝咖啡。）pleier 第 2 位，å drikke 在後面。"}], "q1": "V2 規則是什麼？有兩個動詞時哪一個要排第二？", "q2": "Jeg pleier å drikke kaffe 這句，哪個字被 V2 綁住？另一個動詞在哪？"}, {"id": "C4", "type": "comparison", "title": "為什麼主詞會跑到後面", "lead": "句首被別的字佔走，動詞要守第二位，主詞只好退到第三。", "points": [{"label": "原本", "body": "Jeg bor i Bergen nå.（我現在住在卑爾根。）主詞 jeg 第 1，動詞 bor 第 2。"}, {"label": "把 nå 搬到句首", "body": "第 1 位變成 nå。動詞一定要第 2，所以 bor 跟上來；jeg 退到第 3。"}, {"label": "結果", "body": "Nå bor jeg i Bergen. 這叫倒裝，意思不變，只是強調「現在」。"}, {"label": "常見錯誤", "body": "Nå jeg bor i Bergen ✗，動詞掉到第 3 位了。"}], "q1": "什麼時候會倒裝？倒裝後主詞在第幾位？", "q2": "把 I dag 放句首時，為什麼是「主詞」往後退，而不是動詞往後退？"}, {"id": "C5", "type": "concept", "title": "問句的排法", "lead": "是非問句動詞開頭，疑問詞問句疑問詞開頭，動詞都緊跟著。", "points": [{"label": "是非問句", "body": "直接動詞開頭：Snakker du engelsk?（你會說英文嗎？）回答 ja 或 nei。"}, {"label": "疑問詞問句", "body": "疑問詞第 1，動詞第 2：Hva studerer du?（你讀什麼？）"}, {"label": "有兩個動詞", "body": "第二個動詞一樣加 å、放主詞後面：Pleier du å spise frokost?（你平常吃早餐嗎？）"}], "q1": "兩種問句各怎麼開頭？第二個動詞放哪？", "q2": "是非問句動詞在第 1 位，算不算違反 V2？疑問詞問句為什麼還是符合 V2？"}, {"id": "C6", "type": "concept", "title": "ikke 放哪裡", "lead": "ikke（不）放在第一個動詞的正後面。", "points": [{"label": "規則", "body": "ikke 緊跟在第一個動詞後面。"}, {"label": "一個動詞", "body": "Han vet ikke.（他不知道。）Vi studerer ikke sammen.（我們不一起讀書。）"}, {"label": "兩個動詞", "body": "Jeg pleier ikke å drikke kaffe.（我平常不喝咖啡。）ikke 夾在 pleier 和 å drikke 中間。"}], "q1": "ikke 放哪裡？有兩個動詞時夾在哪？", "q2": "Jeg skal kjøpe melk（我要買牛奶）改成否定，ikke 放哪？為什麼？"}, {"id": "C7", "type": "concept", "title": "第二個動詞要加 å", "lead": "兩個動詞連用，第二個前面加 å、用原形。", "points": [{"label": "規則", "body": "像英文的 to：Jeg liker å smake nye retter.（我喜歡嚐新菜。）"}, {"label": "常見搭配", "body": "like（喜歡）、pleie（習慣）、prøve（試著）、begynne（開始）後面都接 å。"}, {"label": "例外", "body": "情態動詞（skal、vil、kan、må、bør）後面不加 å。"}], "q1": "兩個動詞連用，第二個長什麼樣？哪些動詞常接 å？", "q2": "Begynner du å bli sulten?（你開始餓了嗎？）如果把 begynner 換成 vil，å 還在嗎？"}, {"id": "C8", "type": "concept", "title": "五個情態動詞", "lead": "skal 計畫、vil 想要、kan 可以、må 必須、bør 應該。", "points": [{"label": "skal", "body": "計畫、打算：Han skal spise.（他要吃了。）"}, {"label": "vil", "body": "想要：Jeg vil spise en banan.（我想吃香蕉。）"}, {"label": "kan", "body": "會、可以、可能：Jeg kan besøke deg.（我可以去找你。）"}, {"label": "må", "body": "必須：Nå må jeg kjøpe melk.（我現在得買牛奶。）"}, {"label": "bør", "body": "應該、最好：Han bør spise.（他最好吃一點。）"}], "q1": "五個情態動詞各是什麼意思？", "q2": "Du må spise 和 Du bør spise，聽起來壓力差在哪？"}, {"id": "C9", "type": "procedure", "title": "要不要加 å，看前面那個動詞", "lead": "前面是一般動詞就加 å；是情態動詞就不加。", "points": [{"label": "一般動詞", "body": "liker、pleier、prøver 後面 → å + 原形：Jeg liker å lage mat."}, {"label": "情態動詞", "body": "skal、vil、kan、må、bør 後面 → 直接原形：Jeg vil lage mat."}, {"label": "常見錯誤", "body": "Han skal å spise ✗。要說 Han skal spise。"}, {"label": "情態動詞 + 地點", "body": "要去某處時可以省掉動詞：Jeg skal på konsert.（我要去演唱會。）Vi må hjem.（我們得回家了。）"}], "q1": "哪種動詞後面加 å？哪種不加？情態動詞什麼時候可以不接動詞？", "q2": "寫句子時怎麼判斷要不要加 å？你會先看哪個字？"}, {"id": "C10", "type": "procedure", "title": "每個成分站哪裡", "lead": "動詞第 2；主詞第 1 或第 3；時間詞句首或句尾；å + 動詞排最後。", "points": [{"label": "第一個動詞", "body": "永遠第 2 位。"}, {"label": "主詞", "body": "通常第 1 位。句首被時間詞佔走就退到第 3 位。"}, {"label": "時間詞", "body": "放句首（會倒裝）或放句尾（不倒裝）都可以。"}, {"label": "第二個動詞", "body": "å + 原形，排在主詞和第一個動詞後面。"}], "q1": "句子裡四種成分各可以站哪？", "q2": "I dag prøver de å bestille på norsk（今天他們試著用挪威語點餐），每個字各在第幾位？"}, {"id": "C11", "type": "concept", "title": "講未來的三種說法", "lead": "現在式加時間詞、skal、kommer til å，三種都行。", "points": [{"label": "現在式 + 時間", "body": "最簡單：Vi reiser i morgen.（我們明天出發。）"}, {"label": "skal + 原形", "body": "有計畫的事：Vi skal reise til Berlin i juni.（我們六月要去柏林。）"}, {"label": "kommer til å + 原形", "body": "預料會發生、通常不是自己安排的：Jeg kommer til å savne deg.（我會想你的。）"}], "q1": "三種講未來的句型是什麼？", "q2": "「已經訂好的旅行」和「我大概會很累」，各適合用哪一種？"}, {"id": "C12", "type": "application", "title": "練習：排一句有情態動詞的句子", "lead": "用 I morgen 開頭，把 må、du、komme、presis 排對。", "points": [{"label": "題目", "body": "字卡：må、I morgen、du、presis（準時）、komme（來）。"}, {"label": "要求", "body": "以 I morgen 開頭，排出一句完整的話。"}, {"label": "提醒", "body": "有情態動詞 må，後面接原形 komme，中間不加 å。"}, {"label": "用到的規則", "body": "V2、倒裝、情態動詞不加 å。"}], "q1": "這句的句首是什麼？用到哪些規則？", "q2": "你排出來的句子裡，må、du、komme 為什麼是這個順序？每一步靠哪條規則？"}]}, {"id": "02-pronomen", "short": "人稱代名詞", "description": "我你他、受詞形、反身代名詞", "cards": [{"id": "C1", "type": "concept", "title": "主詞用的代名詞", "lead": "jeg 我、du 你、han 他、hun 她、den/det 它、vi 我們、dere 你們、de 他們。", "points": [{"label": "單數", "body": "jeg（我）、du（你）、han（他）、hun（她）。"}, {"label": "「它」有兩個", "body": "den 和 det 都是「它」，指東西或動物，看名詞性別選。"}, {"label": "複數", "body": "vi（我們）、dere（你們）、de（他們／它們）。"}], "q1": "九個主詞代名詞各是什麼意思？", "q2": "講一隻貓的時候，為什麼不用 han 或 hun？"}, {"id": "C2", "type": "concept", "title": "den 還是 det", "lead": "陽性、陰性名詞用 den；中性名詞用 det。", "points": [{"label": "規則", "body": "看那個東西的名詞是 en 還是 et：en 開頭用 den，et 開頭用 det。"}, {"label": "den 的例子", "body": "en katt（貓）→ Den spiser.（牠在吃。）en skillingsbolle（肉桂捲）→ Den koster 35 kroner."}, {"label": "det 的例子", "body": "et troll（山妖）→ Det spiser. et rundstykke（小圓麵包）→ Det koster 13 kroner."}, {"label": "講人", "body": "人就用 han 或 hun：Ulrik har en bror. Han heter Henrik."}], "q1": "選 den 或 det 要看什麼？講人用什麼？", "q2": "et eple（蘋果）要用 den 還是 det？你是看哪個字決定的？"}, {"id": "C3", "type": "concept", "title": "受詞用的代名詞", "lead": "當受詞時 jeg 變 meg、du 變 deg、hun 變 henne、vi 變 oss、de 變 dem。", "points": [{"label": "我、你", "body": "jeg → meg，du → deg。"}, {"label": "他、她", "body": "han → ham（也可以寫 han），hun → henne。"}, {"label": "它", "body": "den、det 不變。"}, {"label": "複數", "body": "vi → oss，dere 不變，de → dem（也可以寫 de）。"}], "q1": "每個代名詞當受詞時變成什麼？", "q2": "哪些代名詞當受詞完全不用變？哪些有兩種寫法？"}, {"id": "C4", "type": "procedure", "title": "什麼時候用受詞形", "lead": "不是主詞就用受詞形，包括動詞後面和介系詞後面。", "points": [{"label": "主詞形", "body": "當主詞：Jeg bor på Hatleberg.（我住在 Hatleberg。）"}, {"label": "動詞後面", "body": "當受詞：Vil du besøke meg?（你要來找我嗎？）"}, {"label": "介系詞後面", "body": "也用受詞形：Hvordan går det med deg?（你好嗎？）"}, {"label": "一句裡兩種都有", "body": "Kjenner du henne?（你認識她嗎？）du 是主詞，henne 是受詞。"}], "q1": "什麼時候用主詞形、什麼時候用受詞形？各舉一例。", "q2": "Kan du hjelpe meg?（你可以幫我嗎？）為什麼是 du 和 meg，不是 deg 和 jeg？"}, {"id": "C5", "type": "concept", "title": "反身代名詞長什麼樣", "lead": "跟受詞形幾乎一樣，只有第三人稱全部變成 seg。", "points": [{"label": "我、你、我們、你們", "body": "meg、deg、oss、dere，和受詞形一樣。"}, {"label": "他、她、它、他們", "body": "全部都是 seg。"}, {"label": "例句", "body": "Jeg vasker meg.（我洗澡。）Du vasker deg. De vasker seg."}], "q1": "每個人稱的反身代名詞是什麼？", "q2": "為什麼只有第三人稱要另外記 seg？其他人稱為什麼不用背？"}, {"id": "C6", "type": "comparison", "title": "什麼時候用反身", "lead": "動作做在自己身上就用反身；做在別人身上就用一般受詞。", "points": [{"label": "條件", "body": "主詞和受詞是同一個人（或同一隻動物）。"}, {"label": "用反身", "body": "Katten vasker seg.（貓在洗自己。）"}, {"label": "不用反身", "body": "Jeg vasker henne.（我幫她洗。）主詞是我、受詞是她，不同人。"}, {"label": "第三人稱最容易搞混", "body": "Han vasker seg（他洗自己）和 Han vasker ham（他幫另一個男生洗）意思不同。"}], "q1": "什麼情況用反身代名詞？不用的時候改成什麼？", "q2": "「她幫自己洗」和「她幫另一個女生洗」，受詞各用哪個字？"}, {"id": "C7", "type": "concept", "title": "早晚作息的反身動詞", "lead": "穿衣、化妝、刮鬍子、上床睡覺都是反身動詞，seg 要跟著主詞換。", "points": [{"label": "å kle på seg", "body": "穿衣服：Han kler på seg etter frokost.（他早餐後穿衣服。）"}, {"label": "å sminke seg", "body": "化妝：Sminker du deg ofte?（你常化妝嗎？）"}, {"label": "å barbere seg", "body": "刮鬍子。"}, {"label": "å legge seg", "body": "上床睡覺：Han legger seg sent.（他很晚睡。）"}, {"label": "å ha på seg", "body": "身上穿著、戴著。"}], "q1": "這五個動詞各是什麼意思？", "q2": "講你自己早上的準備時，這些動詞裡的 seg 要換成什麼？"}, {"id": "C8", "type": "concept", "title": "心情類的反身動詞", "lead": "期待、怕、玩得開心、專心、結婚，都要帶反身代名詞。", "points": [{"label": "å glede seg til", "body": "期待：Jeg gleder meg til kvelden.（我好期待今晚。）"}, {"label": "å grue seg til", "body": "很不想面對、害怕：和 glede seg 相反。"}, {"label": "å kose seg", "body": "玩得很開心、很享受：De koser seg på konserten."}, {"label": "å konsentrere seg", "body": "專心：Vi konsentrerer oss."}, {"label": "å gifte seg", "body": "結婚：Skal du gifte deg allerede?（你這麼快就要結婚了？）"}], "q1": "這五個動詞各是什麼意思？", "q2": "glede seg 和 grue seg 各適合什麼情境？用 jeg 開頭時 seg 換成什麼？"}, {"id": "C9", "type": "concept", "title": "動作類的反身動詞", "lead": "替自己做、隨身帶、趕快、打扮，seg 一樣跟主詞換。", "points": [{"label": "å lage seg", "body": "替自己做：Jeg lager meg en stor matpakke.（我幫自己做一大份便當。）"}, {"label": "å ta med seg", "body": "隨身帶：Tar dere med dere paraply?（你們有帶傘嗎？）"}, {"label": "å skynde seg", "body": "趕快：Hun skynder seg til bybanestoppet.（她趕去輕軌站。）"}, {"label": "å fikse seg", "body": "打扮一下：Han fikser seg før konserten."}], "q1": "這四個動詞各是什麼意思？", "q2": "Tar dere med dere paraply? 這句為什麼出現兩次 dere？各是什麼角色？"}, {"id": "C10", "type": "procedure", "title": "三種形式一次對照", "lead": "第一、二人稱受詞形＝反身形；第三人稱受詞形各不同、反身形全是 seg。", "points": [{"label": "我、你、我們、你們", "body": "受詞和反身一樣：meg、deg、oss、dere。"}, {"label": "他、她", "body": "受詞是 ham、henne；反身是 seg。"}, {"label": "他們", "body": "受詞是 dem；反身是 seg。"}, {"label": "它", "body": "主詞和受詞都是 den/det；反身是 seg。"}], "q1": "各人稱的主詞形、受詞形、反身形有什麼異同？", "q2": "為什麼第三人稱比第一、二人稱更要分清楚受詞和反身？"}]}, {"id": "03-substantiv-possessiv-adjektiv", "short": "名詞、所有格、形容詞", "description": "en/et、我的你的、大的小的", "cards": [{"id": "C1", "type": "concept", "title": "名詞有三種性別", "lead": "看冠詞：en 陽性、ei 陰性、et 中性。卑爾根只用 en 和 et。", "points": [{"label": "陽性 en", "body": "en banan（香蕉）、en student（學生）。"}, {"label": "陰性 ei", "body": "ei pære（梨子）。"}, {"label": "中性 et", "body": "et eple（蘋果）、et kurs（課程）。"}, {"label": "卑爾根方言", "body": "卑爾根沒有陰性，陰性名詞也用 en：en pære。"}], "q1": "三種性別各用哪個冠詞？卑爾根方言有什麼不同？", "q2": "在卑爾根聽到 en pære，為什麼不算錯？"}, {"id": "C2", "type": "concept", "title": "en 名詞的四種形式", "lead": "一根香蕉、那根香蕉、幾根香蕉、那些香蕉。", "points": [{"label": "一根", "body": "en banan（陰性 ei pære）。"}, {"label": "那根（限定）", "body": "字尾加 -en：bananen。陰性加 -a：pæra。"}, {"label": "幾根（複數）", "body": "加 -er：bananer、pærer。"}, {"label": "那些（複數限定）", "body": "加 -ene：bananene、pærene。"}], "q1": "en 名詞四種形式的字尾是什麼？", "q2": "陰性和陽性名詞的變化，只有哪一個形式不一樣？"}, {"id": "C3", "type": "concept", "title": "et 名詞的四種形式", "lead": "一顆蘋果、那顆蘋果、幾顆蘋果、那些蘋果。", "points": [{"label": "一顆", "body": "et eple、et vindu（窗戶）。"}, {"label": "那顆（限定）", "body": "加 -t 或 -et：eplet、vinduet。"}, {"label": "幾顆（複數）", "body": "加 -er：epler、vinduer。"}, {"label": "那些（複數限定）", "body": "加 -ene：eplene、vinduene。"}], "q1": "et 名詞四種形式的字尾是什麼？", "q2": "看到 vinduene，怎麼一步步推回 et vindu？"}, {"id": "C4", "type": "concept", "title": "複數不變的 et 名詞", "lead": "單音節的 et 名詞，複數不加字尾：et kurs → to kurs。", "points": [{"label": "哪些字", "body": "et bær（莓果）、et kurs（課）、et glass（杯子）這種短的 et 名詞。"}, {"label": "那個（限定）", "body": "照常加 -et：bæret、kurset。"}, {"label": "幾個（複數）", "body": "不加字尾：to kurs、mange bær。"}, {"label": "那些（複數限定）", "body": "照常加 -ene：bærene、alle kursene。"}], "q1": "這類名詞四種形式是什麼？特別的是哪一個？", "q2": "聽到 to kurs，怎麼知道是複數？"}, {"id": "C5", "type": "concept", "title": "我的、你的、他的", "lead": "min/mitt/mine 和 din/ditt/dine 會變；hans、hennes、deres 不變。", "points": [{"label": "我的、你的", "body": "min、mitt、mine／din、ditt、dine。跟著名詞是 en、et 還是複數變。"}, {"label": "他的、她的", "body": "hans、hennes，怎麼接都不變。"}, {"label": "我們的", "body": "vår、vårt、våre，一樣會變。"}, {"label": "你們的、他們的", "body": "都是 deres，不變。"}], "q1": "各人稱的所有格是什麼？哪些會變化？", "q2": "同樣是「我的」，stolen（椅子）、huset（房子）、foreldrene（父母）後面為什麼接的字不一樣？"}, {"id": "C6", "type": "procedure", "title": "所有格放前面還是後面", "lead": "放後面名詞要加限定字尾（rommet mitt）；放前面名詞用原形（mitt rom）。", "points": [{"label": "放後面（最常用）", "body": "名詞變限定形：rommet mitt（我的房間）、maten min（我的食物）。"}, {"label": "放前面（強調）", "body": "名詞用原形：mitt rom、min mat。"}, {"label": "什麼時候放前面", "body": "強調「是我的、不是你的」：Det er mitt problem.（那是我的問題。）"}], "q1": "所有格放前後，名詞各用什麼形式？什麼時候放前面？", "q2": "「這是我的食物」可以說 maten min 也可以說 min mat，名詞怎麼跟著變？"}, {"id": "C7", "type": "concept", "title": "形容詞的基本變化", "lead": "en 名詞不變、et 名詞加 -t、複數加 -e。", "points": [{"label": "en 名詞", "body": "原形：en stor leilighet（一間大公寓）、Leiligheten er stor."}, {"label": "et 名詞", "body": "加 -t：et stort rom（一個大房間）、Rommet er stort."}, {"label": "複數", "body": "加 -e：store vinduer（大窗戶）、Vinduene er store."}], "q1": "形容詞三種情況的字尾是什麼？", "q2": "Huset er stort 的 stort 為什麼要加 -t？"}, {"id": "C8", "type": "concept", "title": "三個不規則形容詞", "lead": "ny 新、gammel 舊、liten 小，變法要另外記。", "points": [{"label": "ny（新）", "body": "et nytt rom、nye vinduer。中性要兩個 t。"}, {"label": "gammel（舊）", "body": "et gammelt rom、gamle vinduer。複數少一個 m 和 e。"}, {"label": "liten（小）", "body": "et lite rom、små vinduer。複數整個換成 små。"}], "q1": "這三個形容詞的中性和複數是什麼？", "q2": "liten 的變化跟一般規則比，哪裡最特別？"}, {"id": "C9", "type": "concept", "title": "顏色也是形容詞", "lead": "大多數顏色照規則變；rosa、lilla 完全不變。", "points": [{"label": "一般顏色", "body": "rød 紅、gul 黃：et rødt hus、gule gardiner（黃窗簾）。"}, {"label": "grønn 綠", "body": "et grønt bord、grønne planter。中性只剩一個 n。"}, {"label": "blå 藍、hvit 白", "body": "中性 blått、hvitt；複數 blå(e)、hvite。"}, {"label": "rosa 粉、lilla 紫", "body": "-a 結尾的顏色不變：rosa gardiner、et lilla hus。"}], "q1": "顏色形容詞怎麼變？哪些不變？", "q2": "en rosa leilighet 變成 et rosa kjøkken，形容詞為什麼不用改？"}, {"id": "C10", "type": "concept", "title": "中性不加 -t 的形容詞", "lead": "-ig 結尾和 norsk 這類，中性不加 -t。", "points": [{"label": "-ig 結尾", "body": "et koselig hus（溫馨的房子）、et hyggelig rom。不加 t。"}, {"label": "norsk", "body": "et norsk måltid（一頓挪威餐）。不加 t。"}, {"label": "對照", "body": "falsk（假的）要加：et falskt smil（假笑）。"}], "q1": "哪些形容詞中性不加 -t？舉一個要加的對照。", "q2": "寫 et hyggelig rom 時，hyggelig 為什麼不用加 -t？"}, {"id": "C11", "type": "procedure", "title": "形容詞要配合名詞", "lead": "先看名詞是 en 還是 et，再看單數還是複數，形容詞跟著變。", "points": [{"label": "第一步看性別", "body": "et 名詞單數 → 加 -t。"}, {"label": "第二步看數量", "body": "複數 → 加 -e，不管 en 還是 et。"}, {"label": "放哪裡都要配合", "body": "放名詞前面（en stor leilighet）或 er 後面（Leiligheten er stor）都一樣。"}], "q1": "形容詞變化要看名詞的哪兩件事？", "q2": "Vinduene er ___（ny），你依序要判斷什麼？填什麼？"}, {"id": "C12", "type": "application", "title": "練習：用所有格和形容詞說「我的房間很大」", "lead": "rom 是 et 名詞，所有格放後面，形容詞配中性。", "points": [{"label": "題目", "body": "跟同學介紹房間，rom 是 et rom。"}, {"label": "要說的", "body": "「我的房間很大」，用 min 和 stor。"}, {"label": "條件", "body": "所有格放名詞後面，用 er 連接。"}, {"label": "會用到", "body": "min/mitt/mine 的變化、形容詞中性加 -t。"}], "q1": "這句要用哪個所有格、形容詞變成什麼？", "q2": "你寫出的句子裡，rom、所有格、stor 各用了什麼形式？為什麼？"}]}, {"id": "04-tid-og-sted", "short": "時間與地點", "description": "日期、på/i/om、東西在哪裡", "cards": [{"id": "C1", "type": "concept", "title": "星期、季節、小寫", "lead": "星期和月份都小寫；週六加週日叫 helg。", "points": [{"label": "星期", "body": "mandag、tirsdag、onsdag、torsdag、fredag、lørdag、søndag。"}, {"label": "週末", "body": "lørdag + søndag = helg。"}, {"label": "季節", "body": "vår 春（3–5 月）、sommer 夏（6–8 月）、høst 秋（9–11 月）、vinter 冬（12–2 月）。"}, {"label": "小寫", "body": "星期和月份開頭都小寫：Det er mandag i dag."}], "q1": "七個星期、四個季節怎麼說？寫的時候注意什麼？", "q2": "十月的某個星期六，是哪個季節、算不算 helg？寫下來要注意什麼？"}, {"id": "C2", "type": "concept", "title": "星期用 på，月份用 i", "lead": "på mandag（星期一）、i januar（一月）、i helgen（週末）。", "points": [{"label": "星期 → på", "body": "på mandag（這個星期一）。每週固定的事用複數：på tirsdager（每個星期二）。"}, {"label": "月份 → i", "body": "i januar。Jeg er født i mai.（我五月生。）"}, {"label": "週末 → i", "body": "i helgen（這個週末）、i helgene（每個週末）。"}], "q1": "星期、月份、週末前面各用什麼介系詞？", "q2": "på mandag 和 på mandager 差在哪？"}, {"id": "C3", "type": "comparison", "title": "om 還是 i：重複的用 om，單次的用 i", "lead": "每天早上 om morgenen；今天晚上 i kveld。", "points": [{"label": "每次都會發生", "body": "用 om + 限定形：om morgenen（每天早上）、om vinteren（每年冬天）。"}, {"label": "某一次", "body": "用 i：i kveld（今晚）、i høst（今年秋天）。"}, {"label": "對照", "body": "Om kvelden pleier jeg å gå ut.（我晚上通常會出門。）I kveld skal jeg se en film.（今晚我要看電影。）"}], "q1": "om 和 i 各用在哪種時間？om 後面名詞是什麼形式？", "q2": "Om høsten liker jeg å lese 和 I høst skal jeg på biltur，為什麼介系詞不一樣？"}, {"id": "C4", "type": "concept", "title": "i 開頭的時間詞", "lead": "昨天、今天、明天、今晚，和「持續多久」都用 i。", "points": [{"label": "前後幾天", "body": "i forgårs 前天、i går 昨天、i dag 今天、i morgen 明天、i overmorgen 後天。"}, {"label": "今天的各時段", "body": "i morges 今天早上、i formiddag 今天上午、i ettermiddag 今天下午、i kveld 今晚、i natt 今晚半夜。"}, {"label": "持續多久", "body": "i + 時間長度：Jeg leste i to timer.（我讀了兩小時。）"}], "q1": "i 開頭的日子和時段怎麼說？i 還能表示什麼？", "q2": "i to timer 的 i 和 i kveld 的 i，意思差在哪？"}, {"id": "C5", "type": "concept", "title": "第一到第十", "lead": "日期和樓層要用序數：første、andre、tredje…", "points": [{"label": "1–3", "body": "første、andre、tredje。"}, {"label": "4–6", "body": "fjerde、femte、sjette。"}, {"label": "7–10", "body": "syvende（或 sjuende）、åttende、niende、tiende。"}, {"label": "用在哪", "body": "日期、樓層：Stephanie bor i 4. etasje.（她住四樓，唸 fjerde。）"}], "q1": "1 到 10 的序數是什麼？用在哪？", "q2": "「我住三樓」要用 tre 還是 tredje？為什麼？"}, {"id": "C6", "type": "concept", "title": "第十一到第三十", "lead": "大多是數字加 -de，幾個唸法要注意。", "points": [{"label": "11–13", "body": "ellevte、tolvte、trettende。tolvte 唸 /tållte/。"}, {"label": "14–19", "body": "數字加 -de：fjortende、femtende、attende、nittende。"}, {"label": "要注意的唸法", "body": "sekstende 唸 /seistene/，syttende 唸 /søttene/。"}, {"label": "20 以上", "body": "tjuende（20）、tjueførste（21）、trettiende（30）。"}], "q1": "11 到 30 的序數有什麼規律？哪幾個唸法特別？", "q2": "看到 18.，你怎麼推出它的序數？"}, {"id": "C7", "type": "procedure", "title": "日期和年份怎麼唸", "lead": "先唸日（序數），再唸月名或 i + 月的序數；年份兩兩一組。", "points": [{"label": "先唸日", "body": "24.10 先唸 tjuefjerde。"}, {"label": "再唸月", "body": "說月名 oktober，或說 i tiende（第十個月）。"}, {"label": "年份", "body": "1998 唸 nitten-nittiåtte（19-98）。"}, {"label": "問生日", "body": "Når har du bursdag?（你生日幾號？）Jeg e     speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = noVoice(); if(v) u.voice = v; u.lang = v ? v.lang : 'nb-NO'; u.rate = 0.85;
    if(el){ el.classList.add('playing'); u.onend = u.onerror = ()=>el.classList.remove('playing'); }
    speechSynthesis.speak(u);
  }catch(e){}
}
// 把一段中文說明裡的挪威語片段變成可以點的字（全形括號裡的英文解釋不算）
const LATIN = /[A-Za-zÆØÅæøåÉé][A-Za-zÆØÅæøåÉé0-9'’.,?!:\-]*(?: [A-Za-zÆØÅæøåÉé0-9'’.,?!:\-]+)*/g;
function sayable(text){
  return String(text).split(/(（[^）]*）)/).map(seg=>{
    if(seg.startsWith('（')) return esc(seg);
    return esc(seg).replace(LATIN, m=>{
      const clean = m.replace(/[.,?!:]+$/,'');
      if(clean.length < 2 || /^(V2|L\d+|t|s|r|e|m)$/.test(clean)) return m;
      return `<button class="say" data-say="${esc(clean)}" title="聽發音">${m}</button>`;
    });
  }).join('');
}
function voiceNote(){
  if(!('speechSynthesis' in window)) return '<div class="novoice">這個瀏覽器不支援語音朗讀。</div>';
  if(voices.length && !voices.some(v=>/^(nb|nn|no)/i.test(v.lang))) return '<div class="novoice">你的裝置還沒有挪威語語音，現在會用別的語言的聲音唸，發音不準。到「進度與發音」分頁可以看瀏覽器找到哪些聲音、手動挑一個試聽。</div>';
  return '';
}
document.addEventListener('click', e=>{ const b = e.target.closest('.say,[data-say]'); if(b) speak(b.dataset.say, b); });
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// ---- spaced repetition (simple Leitner: box 0-4, interval 0/1/3/7/14 days)
const INTERVALS = [0,1,3,7,14];
function cardKey(d,c){ return d.id+'/'+c.id; }
function due(k){ const r = state.cards[k]; if(!r) return true; return r.next <= today(); }
function grade(k, ok){
  const r = state.cards[k] || {box:0, seen:0};
  r.box = ok ? Math.min(4, r.box+1) : 0; r.seen++;
  const n = new Date(); n.setDate(n.getDate()+INTERVALS[r.box]); r.next = n.toISOString().slice(0,10);
  state.cards[k] = r; logEvent('card', ok);
}

// ---- tabs
const main = document.getElementById('main');
let tab = 'decks';
try{ const h = location.hash.slice(1); if(['decks','verbs','order','stats'].includes(h)) tab = h; }catch(e){}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if(!b) return;
  tab = b.dataset.tab; render();
});
function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
  ({decks:renderDecks, verbs:renderVerbs, order:renderOrder, stats:renderStats})[tab]();
  renderStreak();
}
function renderStreak(){
  const days = new Set(state.log.map(l=>l.d)); let n=0; const d=new Date();
  while(days.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); }
  const todayN = state.log.filter(l=>l.d===today()).length;
  document.getElementById('streak').textContent = n ? `連續 ${n} 天 · 今天 ${todayN} 題` : (todayN?`今天 ${todayN} 題`:'');
}

// ---- Decks
let session = null;
function renderDecks(){
  if(session) return renderSession();
  const dueAll = DATA.decks.reduce((n,d)=>n+d.cards.filter(c=>due(cardKey(d,c))).length,0);
  let h = `<h2>五副複習卡，${DATA.decks.reduce((n,d)=>n+d.cards.length,0)} 張</h2>
  <p class="lead">先看規則和例句，翻面後試著回答問題。卡片上藍色底線的挪威語，點一下就會唸給你聽。答得出來按「記得」，這張卡會隔幾天再出現；答不出來按「再看」，明天再複習一次。今天該複習 ${dueAll} 張。</p>
  <div class="row" style="margin:0 0 16px">
    <button class="btn primary" id="studyDue" ${dueAll?'':'disabled'}>複習今天該看的卡</button>
    <button class="btn" id="studyAll">隨機 15 張</button>
  </div>${voiceNote()}<div class="grid" style="margin-top:12px">`;
  DATA.decks.forEach((d,i)=>{
    const learned = d.cards.filter(c=>(state.cards[cardKey(d,c)]||{}).box>=2).length;
    const dueN = d.cards.filter(c=>due(cardKey(d,c))).length;
    h += `<button class="deck" data-deck="${i}"><span class="n">Deck ${i+1}</span><span class="t">${esc(d.short)}</span><span class="d">${esc(d.description)}</span>
      <span class="bar"><i style="width:${Math.round(learned/d.cards.length*100)}%"></i></span>
      <span class="meta">${d.cards.length} 張 · 記住 ${learned} · 該複習 ${dueN}</span></button>`;
  });
  main.innerHTML = h + '</div>';
  main.querySelectorAll('.deck').forEach(b=>b.onclick=()=>startSession(DATA.decks[+b.dataset.deck].cards.map(c=>({d:DATA.decks[+b.dataset.deck],c})), DATA.decks[+b.dataset.deck].short));
  document.getElementById('studyDue').onclick=()=>startSession(shuffle(DATA.decks.flatMap(d=>d.cards.filter(c=>due(cardKey(d,c))).map(c=>({d,c})))), '到期複習');
  document.getElementById('studyAll').onclick=()=>startSession(shuffle(DATA.decks.flatMap(d=>d.cards.map(c=>({d,c})))).slice(0,15), '隨機 15 張');
}
function startSession(items, name){
  if(!items.length) return;
  session = {items, i:0, flipped:false, name, ok:0, again:0, browse:false};
  renderSession();
}
function renderSession(){
  const s = session;
  if(s.i >= s.items.length){
    main.innerHTML = `<div class="stage"><h3>${esc(s.name)} 完成</h3><p>記得 ${s.ok} 張，再看 ${s.again} 張。按了「再看」的卡明天會再出現。</p>
      <div class="row"><button class="btn primary" id="back">回到牌組</button></div></div>`;
    document.getElementById('back').onclick=()=>{session=null;render();}; return;
  }
  const {d,c} = s.items[s.i]; const k = cardKey(d,c); const rec = state.cards[k];
  let h = `<div class="toolbar"><button class="btn ghost" id="quit">← ${esc(s.name)}</button><span class="spacer"></span><span class="meta">${s.i+1} / ${s.items.length}${rec?` · 第 ${rec.seen+1} 次`:''}</span></div>
  <div class="stage"><span class="type ${c.type}">${TYPE_NAME[c.type]}</span><h3>${esc(c.title)}</h3>`;
  if(c.lead) h += `<p class="leadtxt">${sayable(c.lead)}</p>`;
  h += '<ul class="pts">' + c.points.map(p=>`<li><b>${sayable(p.label)}</b><span>${sayable(p.body)}</span></li>`).join('') + '</ul>';
  if(s.flipped){
    h += `<div class="back"><div class="q"><small>考考你</small>${esc(c.q1)}</div><div class="q"><small>想想看</small>${esc(c.q2)}</div></div>
    <div class="row"><button class="btn again" id="again">再看</button><button class="btn ok" id="ok">記得</button><span class="spacer"></span><button class="btn ghost" id="prev" ${s.i?'':'disabled'}>上一張</button></div>
    <div class="key">鍵盤：1 再看 · 2 記得</div>`;
  } else {
    h += `<div class="row"><button class="btn primary" id="flip">翻到背面</button><span class="spacer"></span><button class="btn ghost" id="prev" ${s.i?'':'disabled'}>上一張</button></div><div class="key">鍵盤：空白鍵翻面</div>`;
  }
  main.innerHTML = h + '</div>';
  document.getElementById('quit').onclick=()=>{session=null;render();};
  document.getElementById('prev').onclick=()=>{s.i--; s.flipped=false; renderSession();};
  const flip = document.getElementById('flip'); if(flip) flip.onclick=()=>{s.flipped=true; renderSession();};
  const ok = document.getElementById('ok'); if(ok) ok.onclick=()=>{grade(k,true); s.ok++; s.i++; s.flipped=false; renderSession();};
  const ag = document.getElementById('again'); if(ag) ag.onclick=()=>{grade(k,false); s.again++; s.i++; s.flipped=false; renderSession();};
}
document.addEventListener('keydown', e=>{
  if(tab!=='decks' || !session || e.target.matches('input,select,textarea')) return;
  if(e.key===' ' && !session.flipped){ e.preventDefault(); session.flipped=true; renderSession(); }
  else if(session.flipped && e.key==='1'){ document.getElementById('again').click(); }
  else if(session.flipped && e.key==='2'){ document.getElementById('ok').click(); }
});

// ---- Verbs
let vq = null;
const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');
function nextVerb(){
  // prefer verbs with most misses / least seen
  const pool = DATA.verbs.map(v=>{ const r=state.verbs[v.inf]||{ok:0,bad:0}; return {v, w: 1 + r.bad*3 - Math.min(r.ok,3)}; });
  const total = pool.reduce((n,p)=>n+Math.max(p.w,0.2),0); let x=Math.random()*total;
  for(const p of pool){ x -= Math.max(p.w,0.2); if(x<=0) return p.v; }
  return pool[pool.length-1].v;
}
function renderVerbs(){
  if(!vq) vq = {v: nextVerb(), result:null, n:0, ok:0};
  const v = vq.v; const r = state.verbs[v.inf]||{ok:0,bad:0};
  let h = `<h2>動詞拼寫：打出現在式</h2><p class="lead">看到原形和意思，打出現在式（就是「我／你／他」後面接的那個形式）。按 🔊 可以聽發音。寫錯的動詞之後會比較常出現。這輪答對 ${vq.ok} / ${vq.n}。</p>
  <div class="stage"><div class="vq">${esc(v.inf)}<button class="spk" data-say="${esc(v.inf)}" title="聽原形">🔊</button><small>${esc(v.zh)} · ${esc(v.en)}</small></div><div class="meta">之前答對 ${r.ok} 次 · 答錯 ${r.bad} 次</div>`;
  if(vq.result===null){
    h += `<input class="answer" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="jeg / du / han …  ___" aria-label="現在式">
    <div class="row"><button class="btn primary" id="check">檢查</button><button class="btn ghost" id="skip">不知道，看答案</button></div><div class="key">Enter 送出</div>`;
  } else {
    const good = vq.result===true;
    h += `<input class="answer" id="ans" value="${esc(vq.typed)}" disabled>
    <div class="fb ${good?'good':'bad'}">${good?'正確！':'再記一次：'} ${esc(v.inf)} → <b>${esc(v.pres)}</b><button class="spk" data-say="${esc(v.inf)}, ${esc(v.pres)}" title="聽發音">🔊</button>${good?'':`　（你寫的是「${esc(vq.typed||'—')}」）`}</div>
    <div class="row"><button class="btn primary" id="next">下一個</button></div><div class="key">Enter 下一個</div>`;
  }
  main.innerHTML = h + '</div>';
  const ans = document.getElementById('ans');
  const submit = ()=>{
    const typed = ans.value; const good = norm(typed)===norm(v.pres);
    const rec = state.verbs[v.inf]||{ok:0,bad:0}; good?rec.ok++:rec.bad++; state.verbs[v.inf]=rec;
    vq.result=good; vq.typed=typed; vq.n++; if(good) vq.ok++; logEvent('verb', good); renderVerbs();
  };
  const goNext = ()=>{ vq.v=nextVerb(); vq.result=null; vq.typed=''; renderVerbs(); };
  if(vq.result===null){
    ans.focus();
    document.getElementById('check').onclick=submit;
    document.getElementById('skip').onclick=()=>{ ans.value=''; submit(); };
    ans.onkeydown=e=>{ if(e.key==='Enter') submit(); };
  } else {
    const nb = document.getElementById('next'); nb.onclick=goNext; nb.focus();
    nb.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); goNext(); } };
  }
}

// ---- Sentence order
let oq = null;
function newOrder(){
  const item = DATA.sentences[Math.floor(Math.random()*DATA.sentences.length)];
  const words = item.s.split(' ');
  let pool = shuffle(words.map((w,i)=>({w,i})));
  if(pool.map(p=>p.w).join(' ')===item.s) pool = pool.reverse();
  oq = {item, words, pool, placed:[], result:null};
}
function renderOrder(){
  if(!oq) newOrder();
  const q = oq;
  let h = `<h2>句子重組</h2><p class="lead">把字排回正確順序。開頭的字已經是大寫。小提醒：動詞一定排第二，如果句首是時間詞，主詞要排到動詞後面。</p>
  <div class="stage"><div class="meta">出自 Leksjon ${esc(q.item.src.slice(1))} · ${q.words.length} 個字</div>
  <div class="row" style="margin:6px 0 0"><span class="hint">你的句子</span><span class="spacer"></span>${q.placed.length?`<button class="spk" data-say="${esc(q.placed.map(p=>p.w).join(' '))}" title="聽我排的句子">🔊</button>`:''}</div><div class="chips" id="placed" aria-label="你的句子" style="margin-top:4px">${q.placed.map((p,i)=>`<button class="chip placed" data-i="${i}">${esc(p.w)}</button>`).join('')||'<span class="hint">點下面的字，照順序放進來</span>'}</div>
  <div class="chips" id="pool" aria-label="可用的字">${q.pool.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p.w)}</button>`).join('')}</div>`;
  if(q.result!==null){
    h += `<div class="fb ${q.result?'good':'bad'}">${q.result?'正確！':'正確答案：'} <b>${esc(q.item.s)}</b><button class="spk" data-say="${esc(q.item.s)}" title="聽整句">🔊</button></div>`;
  }
  h += `<div class="row">${q.result===null?`<button class="btn primary" id="check" ${q.pool.length?'disabled':''}>檢查</button><button class="btn ghost" id="reset">重排</button>`:`<button class="btn primary" id="next">下一句</button>`}</div></div>`;
  main.innerHTML = h;
  if(q.result===null){
    main.querySelectorAll('#pool .chip').forEach(b=>b.onclick=()=>{ q.placed.push(q.pool.splice(+b.dataset.i,1)[0]); renderOrder(); });
    main.querySelectorAll('#placed .chip').forEach(b=>b.onclick=()=>{ q.pool.push(q.placed.splice(+b.dataset.i,1)[0]); renderOrder(); });
    document.getElementById('check').onclick=()=>{
      const good = q.placed.map(p=>p.w).join(' ')===q.item.s;
      const rec = state.order[q.item.s]||{ok:0,bad:0}; good?rec.ok++:rec.bad++; state.order[q.item.s]=rec;
      q.result=good; logEvent('order', good); renderOrder();
    };
    document.getElementById('reset').onclick=()=>{ q.pool = shuffle(q.pool.concat(q.placed)); q.placed=[]; renderOrder(); };
  } else {
    document.getElementById('next').onclick=()=>{ newOrder(); renderOrder(); };
  }
}

// ---- Stats
function renderStats(){
  const total = DATA.decks.reduce((n,d)=>n+d.cards.length,0);
  const boxes = [0,0,0,0,0];
  DATA.decks.forEach(d=>d.cards.forEach(c=>{ const r=state.cards[cardKey(d,c)]; boxes[r?r.box:0]++; }));
  const vSeen = Object.keys(state.verbs).length;
  const vMastered = Object.values(state.verbs).filter(r=>r.ok>=2 && r.ok>r.bad).length;
  const days = {}; state.log.forEach(l=>{ days[l.d]=days[l.d]||{n:0,ok:0}; days[l.d].n++; days[l.d].ok+=l.ok; });
  const recent = Object.entries(days).sort((a,b)=>b[0]<a[0]?-1:1).slice(0,14);
  const hard = Object.entries(state.verbs).filter(([,r])=>r.bad>0).sort((a,b)=>b[1].bad-a[1].bad).slice(0,8);
  loadVoices();
  const cur = noVoice();
  const opts = voices.map(v=>`<option value="${esc(v.name+'|'+v.lang)}" ${cur&&cur.name===v.name&&cur.lang===v.lang?'selected':''}>${esc(v.name)}（${esc(v.lang)}）</option>`).join('');
  let h = `<h2>發音設定</h2>
  <div class="stage" style="margin-bottom:20px">
    <p class="hint" style="margin:0 0 8px">瀏覽器看到 ${voices.length} 個聲音。${cur?`目前用的是「${esc(cur.name)}（${esc(cur.lang)}）」。`:'沒有找到挪威語的聲音。'}挪威語的語言代碼會是 nb、nn 或 no 開頭。</p>
    <div class="toolbar" style="margin:0"><select id="voiceSel" aria-label="選擇聲音" style="max-width:100%"><option value="">自動（優先挪威語）</option>${opts}</select><button class="btn" id="voiceTest">試聽</button><button class="btn ghost" id="voiceReload">重新掃描</button></div>
    ${voices.length===0?'<div class="novoice">清單是空的。先點一次「試聽」再按「重新掃描」，有些手機要先用過一次才會列出來。</div>':''}
    ${voices.length&&!voices.some(v=>/^(nb|nn|no)/i.test(v.lang))?'<div class="novoice">清單裡沒有挪威語。三星手機：手機設定 → 文字轉語音 → 偏好的引擎選 Samsung → 齒輪 → Install voice data → Norwegian Bokmål。裝好後把瀏覽器完全關掉再開。</div>':''}
  </div>
  <h2>學習進度</h2><p class="lead">這些紀錄只存在這個瀏覽器裡。</p>
  <div class="score">
    <div><b>${boxes[3]+boxes[4]}<span style="font-size:.9rem;color:var(--muted)"> / ${total}</span></b><span>記住的卡（7 天以上才會再出現）</span></div>
    <div><b>${boxes[0]}</b><span>還沒看過、或上次按「再看」的卡</span></div>
    <div><b>${vMastered}<span style="font-size:.9rem;color:var(--muted)"> / 59</span></b><span>掌握的動詞</span></div>
    <div><b>${vSeen}</b><span>練習過的動詞</span></div>
  </div>
  <div class="stage"><h3 style="font-size:1.05rem;margin-top:0">每副卡記住多少</h3><ul class="pts">`;
  DATA.decks.forEach(d=>{
    const learned = d.cards.filter(c=>(state.cards[cardKey(d,c)]||{}).box>=2).length;
    h += `<li><b>${esc(d.short)}</b><span><span class="bar" style="margin:8px 0 2px"><i style="width:${Math.round(learned/d.cards.length*100)}%"></i></span><span class="meta">${learned} / ${d.cards.length}</span></span></li>`;
  });
  h += '</ul></div>';
  if(hard.length){
    h += `<div class="stage" style="margin-top:12px"><h3 style="font-size:1.05rem;margin-top:0">最常寫錯的動詞</h3><ul class="pts">` +
      hard.map(([inf,r])=>{ const v=DATA.verbs.find(x=>x.inf===inf); return `<li><b>${esc(inf)}</b><span>${esc(v.pres)} · ${esc(v.zh)} <span class="meta">（錯 ${r.bad} 次）</span></span></li>`; }).join('') + '</ul></div>';
  }
  h += `<div class="stage" style="margin-top:12px"><h3 style="font-size:1.05rem;margin-top:0">最近 14 天</h3>`;
  h += recent.length ? '<ul class="pts">' + recent.map(([d,x])=>`<li><b>${d}</b><span>${x.n} 題，答對 ${x.ok}</span></li>`).join('') + '</ul>' : '<div class="empty">還沒有紀錄，先去練一輪吧</div>';
  h += `</div><div class="row"><button class="btn ghost" id="wipe">清除所有紀錄</button></div>`;
  main.innerHTML = h;
  document.getElementById('voiceSel').onchange = e => { state.voice = e.target.value; save(); renderStats(); };
  document.getElementById('voiceTest').onclick = e => speak('Hei! Jeg heter Grace. Jeg bor i Bergen og snakker litt norsk.', e.target);
  document.getElementById('voiceReload').onclick = () => { loadVoices(); renderStats(); };
  document.getElementById('wipe').onclick = e => {
    if(e.target.dataset.sure){ state={cards:{},verbs:{},order:{},log:[]}; save(); render(); }
    else { e.target.dataset.sure='1'; e.target.textContent='再按一次確認清除'; e.target.classList.add('again'); }
  };
}
render();
</script>

</body>
</html>
